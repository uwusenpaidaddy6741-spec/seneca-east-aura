<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080b12;color:#f5f7fb}
header{text-align:center;padding:38px 16px;background:#111827;border-bottom:1px solid #263041}
h1{margin:0;font-size:42px}.sub{color:#aab4c4}
.wrap{max-width:1050px;margin:auto;padding:24px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.leader,.row{background:#111827;border:1px solid #263041;border-radius:16px}
.card{text-align:center;padding:18px}.card b{display:block;font-size:28px}.card span,.role,.leader-role,.status{color:#9aa6b8;font-size:13px}
.leader{padding:20px;margin:18px 0}.leader-title{text-transform:uppercase;color:#9aa6b8;font-size:12px}
.leader-main{display:flex;align-items:center;gap:15px;margin-top:8px}.leader-name{font-size:24px;font-weight:800}.leader-score{margin-left:auto;font-size:30px;font-weight:900}
.controls{display:flex;gap:10px;margin-bottom:18px}input,select{background:#111827;color:#fff;border:1px solid #344054;border-radius:10px;padding:12px;font-size:15px}input{flex:1}
.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:55px minmax(170px,1.5fr) 75px minmax(180px,1fr);gap:12px;align-items:center;padding:14px}
.rank{color:#9aa6b8;font-weight:800}.name{font-weight:750}.score{text-align:right;font-size:19px;font-weight:900}
.bar{height:7px;background:#273244;border-radius:99px;overflow:hidden;margin-bottom:9px}.bar i{display:block;height:100%;background:#8b5cf6;border-radius:99px}
.vote{display:flex;align-items:center;gap:9px}button{border:0;border-radius:9px;padding:9px 13px;background:#7c3aed;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;padding:30px;color:#9aa6b8}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr 1fr}.row{grid-template-columns:38px 1fr 60px}.row>div:last-child{grid-column:2/-1}}
</style>

let data=[],cooldownUntil=Number(localStorage.getItem("auraCooldownUntil")||0);
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function remaining(){return Math.max(0,cooldownUntil-Date.now());}
function cdText(){let x=remaining();if(!x)return"Vote";let h=Math.floor(x/36e5),m=Math.floor(x%36e5/6e4),s=Math.floor(x%6e4/1e3);return `${h}h ${String(m).padStart(2,"0")}m ${String(s).padStart(2,"0")}s`;}
async function load(){
try{let r=await fetch(API+"/leaderboard",{cache:"no-store"});if(!r.ok)throw Error();data=await r.json();}
catch(e){console.error(e);data=STAFF.map((s,i)=>({...s,votes:0,aura:72+((s.name.length*17+i*13)%2400)/100}));}
render();
}
function render(){
let q=(document.getElementById("search").value||"").toLowerCase().trim(),d=document.getElementById("dept").value;
let all=[...data].sort((a,b)=>Number(b.votes||0)-Number(a.votes||0)||Number(b.aura||0)-Number(a.aura||0)||a.name.localeCompare(b.name));
let rows=all.filter(s=>(!q||`${s.name} ${s.role}`.toLowerCase().includes(q))&&(d==="all"||s.dept===d));
document.getElementById("staffCount").textContent=data.length;
document.getElementById("totalVotes").textContent=data.reduce((a,s)=>a+Number(s.votes||0),0).toLocaleString();
document.getElementById("topScore").textContent=all[0]?Number(all[0].aura||0).toFixed(1):"0";
if(all[0])document.getElementById("leaderBox").innerHTML=`<div class="leader-main"><div style="font-size:34px">🏆</div><div><div class="leader-name">${esc(all[0].name)}</div><div class="leader-role">${esc(all[0].role)} • ${esc(all[0].dept)}</div></div><div class="leader-score">${Number(all[0].aura||0).toFixed(1)}</div></div>`;
let max=Math.max(1,...all.map(s=>Number(s.aura||0))),cd=remaining();
document.getElementById("rows").innerHTML=rows.length?rows.map(s=>{
let rank=all.findIndex(x=>x.name===s.name)+1,a=Number(s.aura||0);
return `<div class="row"><div class="rank">#${rank}</div><div><div class="name">${esc(s.name)}</div><div class="role">${esc(s.role)} • ${esc(s.dept)}</div></div><div class="score">${a.toFixed(1)}</div><div><div class="bar"><i style="width:${Math.min(100,a/max*100)}%"></i></div><div class="vote"><button class="vote-btn" data-name="${esc(s.name)}" ${cd?"disabled":""}>⬆ Vote</button><span class="status">${cd?cdText():"Vote"}</span></div></div></div>`;
}).join(""):`<div class="empty">No staff members match your search.</div>`;
}
async function vote(name){
if(remaining())return;
try{
let r=await fetch(API+"/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
let b=await r.json().catch(()=>({}));
if(!r.ok){if(b.error==="COOLDOWN"){cooldownUntil=Date.now()+Number(b.retryAfter||21600000);localStorage.setItem("auraCooldownUntil",cooldownUntil);render();alert("You can vote again in 6 hours.");return;}throw Error();}
cooldownUntil=Date.now()+21600000;localStorage.setItem("auraCooldownUntil",cooldownUntil);
if(b.leaderboard)data=b.leaderboard;else await load();render();
}catch(e){console.error(e);alert("The voting server could not process your vote. Please try again.");}
}

document.getElementById("rows").addEventListener("click",e=>{let b=e.target.closest(".vote-btn");if(b&&!b.disabled)vote(b.dataset.name);});
